name: Package and Release Skill

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.3)"
        required: true
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' || github.event.pull_request.merged == true
    permissions:
      contents: write

    steps:
      - name: Determine tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            TAG=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq ".[] | select(.commit.sha == \"$HEAD_SHA\") | .name" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$TAG" ]; then
              echo "No version tag found on PR head commit $HEAD_SHA, skipping release"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up Python
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: pip install pyyaml

      - name: Extract changelog for version
        if: steps.version.outputs.skip != 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract section between this version header and the next version header (or end of file)
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "["ver"]")) found=1
            }
            found {print}
          ' CHANGELOG.md)

          # Save to file for body_path
          echo "$CHANGELOG" > release_notes.md

          # Check if we found content
          if [ -z "$CHANGELOG" ]; then
            echo "Warning: No changelog found for version $VERSION"
            echo "## Release ${{ steps.version.outputs.tag }}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          fi

      - name: Validate skill
        if: steps.version.outputs.skip != 'true'
        run: python scripts/validate_skill.py shadcn-svelte

      - name: Package skill
        if: steps.version.outputs.skip != 'true'
        run: |
          python scripts/package_skill.py shadcn-svelte dist
          ls -la dist/

      - name: Generate install script
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed "s/__VERSION__/$VERSION/g" scripts/install.sh > dist/install.sh
          chmod +x dist/install.sh
          cat dist/install.sh

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: shadcn-svelte Skill ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          files: |
            dist/shadcn-svelte.skill
            dist/install.sh
          fail_on_unmatched_files: true
